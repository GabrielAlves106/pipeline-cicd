name: Pipeline Demo CI/CD (Dev Only)

on:
  push:
    branches:
      - dev  # O pipeline agora só inicia se o push for na dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar testes
        run: pytest || echo "Nenhum teste encontrado ou erro na execução"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Garante que o deploy só ocorra se a branch for dev
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Simular Deploy
        run: echo "Deploy realizado com sucesso no ambiente de DESENVOLVIMENTO!"