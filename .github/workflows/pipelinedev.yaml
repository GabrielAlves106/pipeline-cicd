name: Pipeline Demo CI/CD
on:
  push:
    branches:
      - main
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requerimentos.txt ]; then pip install -r requerimentos.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar testes
        run: |
          pip install pytest
          pytest

      - name: Zipar artefatos
        run: |
          zip -r artefatos.zip . \
            --exclude="*.git*" \
            --exclude="*__pycache__*" \
            --exclude="*.pytest_cache*"
          echo "Arquivo artefatos.zip criado com sucesso!"
          ls -lh artefatos.zip

      - name: Fazer upload do artefato zipado
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-build
          path: artefatos.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: producao 
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Baixar artefato zipado
        uses: actions/download-artifact@v4
        with:
          name: artefatos-build

      - name: Deszipar artefatos
        run: |
          unzip artefatos.zip -d artefatos_extraidos
          echo "Arquivos extraídos com sucesso!"
          ls -lh artefatos_extraidos/

      - name: Simular Deploy
        run: echo "Deploy realizado com sucesso na branch DEV!"
      
